<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telesales Deficit Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e5e7eb; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(135deg, #0f172a, #1e293b); border-bottom: 3px solid #ba9305; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .logo { width: 44px; height: 44px; background: #ba9305; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: #020617; }
  .title { font-size: 22px; font-weight: 700; color: #f8fafc; }
  .subtitle { font-size: 12px; color: #64748b; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: relative; }
  .overlay { position: absolute; inset: 0; background: rgba(15,23,42,.6); border-radius: 8px; display: flex; align-items: center; justify-content: center; z-index: 10; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.active { opacity: 1; pointer-events: all; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #334155; border-top-color: #ba9305; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .filter-select { position: relative; }
  .filter-select select { padding: 12px 42px 12px 16px; border-radius: 10px; border: 2px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 16px; font-weight: 600; cursor: pointer; appearance: none; -webkit-appearance: none; outline: none; min-width: 160px; }
  .filter-select select:hover:not(:disabled), .filter-select select:focus { border-color: #ba9305; }
  .filter-select select:disabled { opacity: .5; cursor: not-allowed; }
  .filter-select::after { content: "\25BE"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #ba9305; pointer-events: none; }
  .branch-selector select { min-width: 240px; }
  .custom-range { display: none; align-items: center; gap: 8px; }
  .custom-range.visible { display: flex; }
  .custom-range input { padding: 10px; border-radius: 8px; border: 2px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 14px; }
  .custom-range label { font-size: 11px; color: #ba9305; font-weight: 800; text-transform: uppercase; }
  .table-section { flex: 1; padding: 24px 32px; display: flex; flex-direction: column; min-height: 0; }
  .table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .table-title { font-size: 18px; font-weight: 700; color: #f1f5f9; }
  .tools { display: flex; align-items: center; gap: 12px; }
  .count { font-size: 13px; color: #64748b; background: #1e293b; padding: 6px 18px; border-radius: 99px; font-weight: 600; }
  .search { padding: 10px 16px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 15px; width: 260px; outline: none; }
  .search:focus { border-color: #ba9305; }
  .table-wrap { flex: 1; overflow-y: auto; border-radius: 20px; border: 1px solid #334155; background: #0f172a; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { position: sticky; top: 0; background: #1e293b; color: #94a3b8; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; font-weight: 700; padding: 18px 20px; border-bottom: 2px solid #334155; text-align: left; cursor: pointer; user-select: none; }
  thead th:hover { color: #f1f5f9; }
  thead th.active { color: #ba9305; }
  th:nth-child(3), td:nth-child(3) { text-align: right; width: 28%; }
  th:nth-child(1), td:nth-child(1) { width: 40%; }
  td { padding: 14px 20px; border-bottom: 1px solid #1e293b; color: #cbd5e1; font-size: 15px; }
  tbody tr:hover { background: rgba(30,41,59,.6); }
  .name { font-weight: 700; color: #f1f5f9; }
  .branch { color: #94a3b8; }
  .deficit { font-weight: 700; font-variant-numeric: tabular-nums; }
  .neg { color: #ef4444; }
  .pos { color: #22c55e; }
  .msg td { text-align: center; padding: 60px 20px; color: #64748b; }
  footer { text-align: center; padding: 20px; font-size: 12px; color: #475569; border-top: 1px solid #1e293b; }
  footer .hl { color: #ba9305; font-weight: 600; }
  .toast { position: fixed; bottom: 30px; right: 30px; background: #1e293b; border: 1px solid #334155; border-left: 4px solid #ef4444; color: #f1f5f9; padding: 16px 24px; border-radius: 12px; font-weight: 600; z-index: 999; transform: translateX(120%); transition: transform .35s; max-width: 380px; }
  .toast.show { transform: translateX(0); }
  .toast.retry { border-left-color: #38bdf8; }
  @media (max-width: 600px) {
    header, .table-section { padding: 16px 18px; }
    .header-right, .filter-select, .filter-select select, .search { width: 100%; }
    td, thead th { padding: 12px; font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">IP</div>
    <div>
      <div class="title">Telesales Deficit Report</div>
      <div class="subtitle">Individual Telesales Deficit</div>
    </div>
  </div>
  <div class="header-right">
    <div class="overlay" id="loading"><span class="spinner" style="margin:0"></span></div>
    <div class="filter-select">
      <select id="dateSelect">
        <option value="today" selected>Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="7days">Last 7 Days</option>
        <option value="30days">Last 30 Days</option>
        <option value="90days">Last 90 Days</option>
        <option value="custom">Custom Range</option>
      </select>
    </div>
    <div class="custom-range" id="customRange">
      <label>From</label><input type="date" id="dateFrom">
      <label>To</label><input type="date" id="dateTo">
    </div>
    <div class="filter-select branch-selector">
      <select id="branchSelect"><option value="">All Branches</option></select>
    </div>
  </div>
</header>

<div class="table-section">
  <div class="table-header">
    <div class="table-title">Telesales Deficit</div>
    <div class="tools">
      <input class="search" id="searchBox" placeholder="Search name or branch...">
      <span class="count" id="count">0 people</span>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="name">Telesales Name <span class="arrow"></span></th>
          <th data-sort="branch">Branch <span class="arrow"></span></th>
          <th data-sort="deficit">Deficit <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="msg"><td colspan="3"><span class="spinner"></span>Loading telesales data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<footer>
  Last updated: <span class="hl" id="lastUpdated">—</span> &nbsp;|&nbsp; Auto-refreshes every 10 mins &nbsp;|&nbsp;
  Designed and Managed by <span class="hl">MIS.DPT</span>
</footer>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://dashboard-proxy.mis-philmed01-dpt.workers.dev/pharma/";
const AUTO_REFRESH_MS = 600000;
const LOOKBACK_DAYS = 365;
const MIN_TARGET = 100000; // hard floor on each telesale's calculated target (KES)

let allRawData = [], branchPerfData = [], rows = [];
let sort = { key: "deficit", dir: "desc" };
let isLoading = false, abortCtrl = null;

/* ── Branches ─────────────────────────────────────────────── */
const branchNames = {
  "orgbranch-683976e3994a072a600cbd7a":"Head Office","orgbranch-684558f576bd774c32f00d8e":"Naivasha","orgbranch-68455bea76bd774c32f031cc":"Kitengela",
  "orgbranch-68458a4b76bd774c32f10527":"Githurai","orgbranch-684593b176bd774c32f150c6":"Kawangware Wholesale","orgbranch-685001107d3c6f75c8c1d42e":"Karatina",
  "orgbranch-685001217d3c6f75c8c1d491":"Meru","orgbranch-6850012f7d3c6f75c8c1d4f4":"Busia","orgbranch-685001387d3c6f75c8c1d557":"Mombasa Wholesale",
  "orgbranch-685001457d3c6f75c8c1d5ba":"Kisii","orgbranch-685001557d3c6f75c8c1d61d":"Philton","orgbranch-6850015d7d3c6f75c8c1d680":"Kitui Wholesale",
  "orgbranch-685001667d3c6f75c8c1d6e3":"Philmed Malindi","orgbranch-685001967d3c6f75c8c1d746":"Kericho","orgbranch-6850019e7d6f75c8c1d7a9":"Nakuru",
  "orgbranch-685001a77d3c6f75c8c1d80c":"Kisumu","orgbranch-685001b17d3c6f75c8c1d86f":"Philmed Eldoret","orgbranch-685001c17d3c6f75c8c1d8d2":"Philmed Thika",
  "orgbranch-685001ce7d3c6f75c8c1d935":"Voi Branch","orgbranch-685001e27d3c6f75c8c1d998":"Kendia","orgbranch-685001f37d3c6f75c8c1d9fb":"Kakamega",
  "orgbranch-685001ff7d3c6f75c8c1da5e":"Bungoma","orgbranch-685002097d3c6f75c8c1dac1":"Makindu","orgbranch-685002137d3c6f75c8c1db4f":"Rongai Wholesale",
  "orgbranch-685002247d3c6f75c8c1dc25":"Embu","orgbranch-69df9dc58418a65253e015a6":"Arms Narok Wholesale","orgbranch-69f7511b83ba28b7dda7ccd1":"Ol Kalou",
  "orgbranch-6a8c509e44cec8b9b30ec559":"Wote","orgbranch-6a840bfb1936a960f8ec3e7a":"Migori","orgbranch-6a14177260c3a453acb56ceb":"Nanyuki",
  "orgbranch-6a588d82cd53be440ee3078b":"Umoja","orgbranch-6a589046cd53be440e2444b8":"Mwiki","orgbranch-6a5891b4cd53be440e4edbcb":"Silvergates Rongai",
  "orgbranch-6a58930bcd53be440e78342f":"Nanyuki Chemist","orgbranch-6aab99c53cab8a51560407fb":"Silvergate Jacaranda","orgbranch-6908bd9a4397ba1eb00a1783":"Kawangware Retail",
  "orgbranch-69d903089ca75f00087a0446":"Silvergates Imara","orgbranch-6aab9a513cab8a51560d379c":"Arms Agrovet","orgbranch-6a588df2cd53be440eec1dca":"Mihang'o",
  "orgbranch-6a684b171ba6be0c08f8f715":"Arms Ol Kalou","orgbranch-6a5894cdcd53be440ec28678":"Arms Narok Retail","orgbranch-6aab9ac13cab8a5156147c48":"Pharmaweb Wote",
  "orgbranch-6aab9a173cab8a51560a996e":"Pharmaweb Migori","orgbranch-6908be314397ba1eb00cbd10":"Mombasa Retail","orgbranch-6909a662c9bd2cf7596be81d":"Kitui Retail",
  "orgbranch-6a588d19cd53be440eda95d1":"Silvergates Health Solutions","orgbranch-6a588cbdcd53be440ed40590":"Nolimit Healthcare","orgbranch-6908bd8a4397ba1eb009baf2":"Rongai Retail",
  "orgbranch-6a588c18cd53be440ec8a011":"Kawangware Retail 2"
};
const RETAIL_IDS = new Set(["orgbranch-6a5891b4cd53be440e4edbcb","orgbranch-6a58930bcd53be440e78342f","orgbranch-6aab99c53cab8a51560407fb","orgbranch-6908bd9a4397ba1eb00a1783","orgbranch-69d903089ca75f00087a0446","orgbranch-6aab9a513cab8a51560d379c","orgbranch-6a684b171ba6be0c08f8f715","orgbranch-6a5894cdcd53be440ec28678","orgbranch-6aab9ac13cab8a5156147c48","orgbranch-6aab9a173cab8a51560a996e","orgbranch-6a588cbdcd53be440ed40590","orgbranch-6908be314397ba1eb00cbd10"]);
const SEMI_IDS = new Set(["orgbranch-6a588d82cd53be440ee3078b","orgbranch-6a589046cd53be440e2444b8","orgbranch-6a588df2cd53be440eec1dca","orgbranch-6909a662c9bd2cf7596be81d","orgbranch-6908bd8a4397ba1eb009baf2","orgbranch-6a588d19cd53be440eda95d1","orgbranch-6a588c18cd53be440ec8a011"]);

const $ = id => document.getElementById(id);
const branchSelect = $("branchSelect");
Object.entries(branchNames).sort((a, b) => a[1].localeCompare(b[1])).forEach(([id, name]) => {
  if (RETAIL_IDS.has(id) || SEMI_IDS.has(id)) return; // wholesale only
  const o = document.createElement("option"); o.value = id; o.textContent = name; branchSelect.appendChild(o);
});

/* ── Helpers ──────────────────────────────────────────────── */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtKES = n => "KES " + Math.round(Number(n) || 0).toLocaleString();
const dateKey = v => { const m = String(v || "").match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : null; };
const recDate = r => dateKey(r.reportingDate || r.reportDate || r.salesDate || r.date || r.createdAt || r.updatedAt);
const inRange = (d, s, e) => !!d && d >= s && d <= e;
function num(v) {
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return Number.isFinite(v) ? v : 0;
  const n = Number(String(v).replace(/[,%]/g, "").trim());
  return Number.isFinite(n) ? n : 0;
}
const getTarget = r => num(r.dailySalesTarget ?? r.salesTarget ?? r.target ?? r.dailyTarget ?? r.targetSales);
const getNet = r => num(r.netDailySales ?? r.netSales ?? r.dailyNetSales ?? r.branchNetSales);
const rowBranchId = r => r.orgBranchId || r.branchId || "";
const rowBranchName = r => String(r.branchName || r.orgBranchName || branchNames[r.orgBranchId] || "").trim();
const rowPerson = r => String(r.salesPersonName || r.salespersonName || r.salesPerson || r.name || "").trim();

function getDateRange() {
  const p = $("dateSelect").value, today = new Date(), end = fmtDate(today);
  if (p === "custom") {
    let s = $("dateFrom").value || end, e = $("dateTo").value || end;
    if (s > e) [s, e] = [e, s];
    return { startDate: s, endDate: e };
  }
  if (p === "yesterday") { const d = new Date(today); d.setDate(d.getDate() - 1); return { startDate: fmtDate(d), endDate: fmtDate(d) }; }
  const days = { today: 1, "7days": 7, "30days": 30, "90days": 90 }[p] || 1;
  const s = new Date(today); s.setDate(s.getDate() - days + 1);
  return { startDate: fmtDate(s), endDate: end };
}

function syncDateInputs(p) {
  if (p === "custom") return;
  const { startDate, endDate } = getDateRange();
  $("dateFrom").value = startDate; $("dateTo").value = endDate;
}

let toastTimer;
function showToast(msg, type) {
  const t = $("toast"); t.textContent = msg; t.className = "toast" + (type ? " " + type : "");
  void t.offsetWidth; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
}

/* ── API ──────────────────────────────────────────────────── */
async function fetchWithRetry(url, options, maxRetries = 3) {
  for (let i = 0; i <= maxRetries; i++) {
    try {
      const res = await fetch(url, options);
      if (res.status === 409 && i < maxRetries) {
        const delay = 2 ** i * 1000 + Math.random() * 500;
        showToast(`Rate limited — retrying in ${Math.round(delay/1000)}s...`, "retry");
        await new Promise(r => setTimeout(r, delay)); continue;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (err) {
      if (err.name === "AbortError") throw err;
      if (i < maxRetries) { await new Promise(r => setTimeout(r, 2 ** i * 700 + Math.random() * 300)); continue; }
      throw err;
    }
  }
}

function fetchRange() {
  const end = new Date(), start = new Date(end);
  start.setDate(start.getDate() - LOOKBACK_DAYS + 1);
  return `startDate=${fmtDate(start)}&endDate=${fmtDate(end)}`;
}
const unwrap = j => Array.isArray(j) ? j : (j.data || []);
const fetchSales = signal => fetchWithRetry(`${API_URL}sales-person-performance?pageSize=10000&${fetchRange()}`, { signal }).then(unwrap);
const fetchBranches = signal => fetchWithRetry(`${API_URL}branch-sales-performance-reports?${fetchRange()}&pageSize=10000`, { signal }).then(unwrap);

/* ── Calculation ──────────────────────────────────────────── */
/* Branch raw target for the selected period (sum of daily targets). */
function branchRawTargets(startDate, endDate) {
  const perDay = new Map(); // "branch||date" -> target
  for (const r of branchPerfData) {
    const d = recDate(r); if (!inRange(d, startDate, endDate)) continue;
    const name = rowBranchName(r).toLowerCase(); if (!name) continue;
    const k = `${name}||${d}`;
    perDay.set(k, (perDay.get(k) || 0) + getTarget(r));
  }
  const seen = new Set();
  for (const r of allRawData) { // fallback for branch-days missing from branch report
    const d = recDate(r); if (!inRange(d, startDate, endDate)) continue;
    const name = rowBranchName(r).toLowerCase(); if (!name) continue;
    const k = `${name}||${d}`;
    if (perDay.has(k) || seen.has(k)) continue;
    seen.add(k); perDay.set(k, getTarget(r));
  }
  const out = new Map();
  for (const [k, t] of perDay) { const b = k.split("||")[0]; out.set(b, (out.get(b) || 0) + t); }
  return out;
}

function computeRows() {
  const { startDate, endDate } = getDateRange();
  const selected = branchSelect.value;
  const selectedName = (branchNames[selected] || "").toLowerCase();

  // Static ratio source: full previous calendar month
  const now = new Date();
  const lmEnd = new Date(now.getFullYear(), now.getMonth(), 0);
  const lmStart = new Date(lmEnd.getFullYear(), lmEnd.getMonth(), 1);
  const lmS = fmtDate(lmStart), lmE = fmtDate(lmEnd);

  const lmBranch = new Map(), lmPerson = new Map();
  for (const r of allRawData) {
    if (!inRange(recDate(r), lmS, lmE)) continue;
    const name = rowPerson(r), net = getNet(r);
    if (!name || net <= 0) continue;
    const b = rowBranchName(r).toLowerCase();
    lmBranch.set(b, (lmBranch.get(b) || 0) + net);
    const pk = `${name.toLowerCase()}||${b}`;
    lmPerson.set(pk, (lmPerson.get(pk) || 0) + net);
  }

  // Active telesales in selected period
  const people = new Map();
  for (const r of allRawData) {
    if (!inRange(recDate(r), startDate, endDate)) continue;
    const bName = rowBranchName(r), bId = rowBranchId(r);
    if (selected) {
      const match = (bId && bId === selected) || bName.toLowerCase() === selectedName;
      if (!match) continue;
    }
    const name = rowPerson(r), net = getNet(r);
    if (!name || net <= 0) continue;
    const pk = `${name.toLowerCase()}||${bName.toLowerCase()}`;
    if (!people.has(pk)) people.set(pk, { name, branch: bName, sales: 0 });
    people.get(pk).sales += net;
  }

  // Group by branch for ratio fallback
  const activeCount = new Map();
  for (const p of people.values()) { const b = p.branch.toLowerCase(); activeCount.set(b, (activeCount.get(b) || 0) + 1); }

  const targets = branchRawTargets(startDate, endDate);
  const result = [];
  for (const [pk, p] of people) {
    const b = p.branch.toLowerCase();
    const hist = lmPerson.get(pk) || 0, histTotal = lmBranch.get(b) || 0;
    const ratio = histTotal > 0 ? hist / histTotal : 1 / activeCount.get(b);
    const target = Math.max(ratio * (targets.get(b) || 0), MIN_TARGET);
    result.push({ name: p.name, branch: p.branch, deficit: target - p.sales });
  }
  return result;
}

/* ── Render ───────────────────────────────────────────────── */
function render() {
  const q = $("searchBox").value.toLowerCase().trim();
  let data = rows.filter(r => !q || r.name.toLowerCase().includes(q) || r.branch.toLowerCase().includes(q));
  const { key, dir } = sort;
  data = [...data].sort((a, b) => {
    const va = a[key], vb = b[key];
    const c = typeof va === "string" ? va.localeCompare(vb) : va - vb;
    return dir === "asc" ? c : -c;
  });

  $("count").textContent = data.length + (data.length === 1 ? " person" : " people");
  document.querySelectorAll("thead th").forEach(th => {
    const active = th.dataset.sort === key;
    th.classList.toggle("active", active);
    th.querySelector(".arrow").textContent = active ? (dir === "asc" ? "↑" : "↓") : "";
  });

  const tbody = $("tableBody");
  if (!data.length) { tbody.innerHTML = `<tr class="msg"><td colspan="3">No telesales data found for the selected range</td></tr>`; return; }
  tbody.innerHTML = data.map(r => {
    const cls = r.deficit > 0 ? "neg" : "pos";
    const label = r.deficit > 0 ? fmtKES(r.deficit) : r.deficit < 0 ? fmtKES(Math.abs(r.deficit)) + " surplus" : "On Target";
    return `<tr><td class="name">${esc(r.name)}</td><td class="branch">${esc(r.branch)}</td><td class="deficit ${cls}">${label}</td></tr>`;
  }).join("");
}

function refresh() {
  if (!allRawData.length) return;
  rows = computeRows();
  render();
}

/* ── Loading ──────────────────────────────────────────────── */
function setLoading(on) {
  isLoading = on;
  $("loading").classList.toggle("active", on);
  ["dateSelect", "dateFrom", "dateTo", "branchSelect"].forEach(id => $(id).disabled = on);
}

async function loadAllData() {
  if (isLoading) return;
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  const signal = abortCtrl.signal;
  setLoading(true);
  try {
    const [sales, branches] = await Promise.all([fetchSales(signal), fetchBranches(signal)]);
    if (signal.aborted) return;
    allRawData = sales; branchPerfData = branches;
    refresh();
    $("lastUpdated").textContent = new Date().toLocaleTimeString();
  } catch (err) {
    if (err.name === "AbortError") return;
    console.error(err);
    $("tableBody").innerHTML = `<tr class="msg"><td colspan="3">Failed to load data</td></tr>`;
    showToast("Failed to load data: " + err.message);
  } finally {
    if (!signal.aborted) setLoading(false);
  }
}

/* ── Events ───────────────────────────────────────────────── */
document.querySelectorAll("thead th").forEach(th => th.addEventListener("click", () => {
  const key = th.dataset.sort;
  if (sort.key === key) sort.dir = sort.dir === "desc" ? "asc" : "desc";
  else sort = { key, dir: key === "deficit" ? "desc" : "asc" };
  render();
}));

$("dateSelect").addEventListener("change", () => {
  const v = $("dateSelect").value;
  $("customRange").classList.toggle("visible", v === "custom");
  if (v === "custom") return;
  syncDateInputs(v); refresh();
});
function onCustomChange() {
  const f = $("dateFrom").value, t = $("dateTo").value;
  if (f && t && f > t) $("dateTo").value = f;
  refresh();
}
$("dateFrom").addEventListener("change", onCustomChange);
$("dateTo").addEventListener("change", onCustomChange);
branchSelect.addEventListener("change", refresh);

let debounce;
$("searchBox").addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(render, 150); });

/* ── Init ─────────────────────────────────────────────────── */
syncDateInputs("today");
loadAllData();
setInterval(() => { if (!isLoading) loadAllData(); }, AUTO_REFRESH_MS);
</script>
</body>
</html>
